site_name: Studio Pipeline Documentation
site_description: Documentation for the Studio Pipeline using Shotgrid Toolkit and Blender
site_author: Studio Pipeline Team
repo_url: https://github.com/SuperVirtuel/StudioPipeline
repo_name: SuperVirtuel/StudioPipeline

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Pipeline:
      - Overview: pipeline/overview.md
      - Shotgrid Integration: pipeline/shotgrid.md
      - Blender Integration: pipeline/blender.md
  - API Reference:
      - Core: api/core.md
      - Shotgrid: api/shotgrid.md
      - Blender: api/blender.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
